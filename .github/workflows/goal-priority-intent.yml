name: goal-priority-intent

on:
  push:
    branches: [ue-codex]
    paths:
      - "lab/**"
      - ".github/workflows/goal-priority-intent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consequence-driven-goal-revisions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Goal/state/action consistency and real resource accounting
        run: python3 -m unittest lab.tests.test_goal_priority -v
      - name: Paired initial priorities and post-action goal formation
        run: |
          mkdir -p results
          python3 -m lab.goal_priority_study --json results/goal-priority.json | tee results/summary.json
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open("results/goal-priority.json",encoding="utf-8"))
          print("## D1.8 — Goal → action → paid outcome → updated goal")
          print(f"Different initial physical situations: {r['design']['distinct_initial_states']}.")
          print(f"Matched triplets with different initial priorities: {r['design']['total_cases']}.")
          print("Actor uses forecasts only; consequences update a separate goal state before next decision.")
          print("### Changes and controls")
          for k,v in sorted(r["counts"].items()):
              print(f"- {k}: {v}")
          print("\n### First choice with each goal, same physical state")
          for g,counts in r["first_choice_by_goal"].items():
              print(f"- **{g}**: {counts}")
          print("\n### Next physical actions after same first result")
          for m,counts in r["second_action_effects_on_matched_states"].items():
              print(f"- **{m}**: {counts}")
          print("\n### First documented replan examples")
          for ex in r["examples"][:4]:
              print(f"- initial={ex['inputs']}")
              print(f"  actual action={ex['first_actual']['action']}; "
                    f"goal={ex['goal_update']['before']} -> {ex['goal_update']['after']} "
                    f"because {ex['goal_update']['reason']}")
              print(f"  choice adapted={ex['next_intentions']['adapted']['choice']}; "
                    f"frozen={ex['next_intentions']['frozen_control']['choice']}")
          print("\nChecks:",r["checks"])
          assert all(v==0 for v in r["checks"].values()),r["checks"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goal-priority-intent-json
          path: results/
