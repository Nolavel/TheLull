# Player-experience lab: unit tests and one-factor paired experiments.
# Results go to the run summary and to the lab-results artifact. Nothing is committed back.
name: lab

on:
  push:
    paths:
      - "lab/**"
      - ".github/workflows/lab.yml"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Paired seeds per experiment"
        default: "200"

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    env:
      SEEDS: ${{ inputs.seeds || '200' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s lab/tests -t .

      - name: Signs visible vs hidden (same weather, B_readable)
        run: |
          mkdir -p lab-results
          for profile in novice local; do
            python3 -m lab.experiment --variant B_readable --profile "$profile" \
              --days 8 --seeds "$SEEDS" --json "lab-results/signs_B_${profile}.json" --md \
              >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Linked evening-night-day loop (three persistent days)
        run: |
          python3 -m lab.linked_days --days 3 --fuel 5 --stock 8 --json lab-results/linked_days.json --md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          python3 -m lab.linked_days --days 3 --profile novice --fuel 5 --stock 8 --json lab-results/linked_novice.json --md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          python3 -m lab.linked_days --paired --fuel 5 --temp -12 --json lab-results/linked_paired.json >> /dev/null
          python3 -m lab.linked_days --sweep --json lab-results/linked_sweep.json >> /dev/null
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path("lab-results/linked_sweep.json").read_text(encoding="utf-8"))
          print(f"**План изменил вечер:** {result['different_plan_changes_evening']} / {result['cells']} клеток.")
          for x in result['examples'][:6]:
              print(f"- {x['temp']} °C, дров {x['fuel']}, восстановление {x['recovery']}: {list(x['choices'].values())}")
          print("Это наблюдения модели, не измерение интереса игроков.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lab-results
          path: lab-results/
